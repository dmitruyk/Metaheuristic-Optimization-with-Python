name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev,notebooks]'
      - name: Environment
        run: |
          mkdir -p "$RUNNER_TEMP/ci-out"
          python -c 'import json, os, platform, numpy, scipy
          from pathlib import Path
          payload = {
              "python": platform.python_version(),
              "platform": platform.platform(),
              "numpy": numpy.__version__,
              "scipy": scipy.__version__,
          }
          Path(os.environ["RUNNER_TEMP"], "ci-out", "env.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")'
      - name: Ruff and pytest
        run: |
          set -o pipefail
          {
            ruff check .
            ruff format --check .
            pytest -q --junitxml="$RUNNER_TEMP/ci-out/pytest.xml"
            python scripts/validate_doc_links.py
            python -m pip wheel --no-deps -w "$RUNNER_TEMP/wheel" .
            python scripts/handbook_experiment.py --profile quick --output "$RUNNER_TEMP/ci-out/quick_validation.json"
            python scripts/handbook_experiment.py --profile full --output "$RUNNER_TEMP/ci-out/full_experiment_cost_estimate.json"
          } 2>&1 | tee "$RUNNER_TEMP/ci-out/pytest.log"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: ${{ runner.temp }}/ci-out/
          if-no-files-found: warn
          retention-days: 14

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev,notebooks]'
      - name: Execute notebooks
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ci-out"
          python scripts/execute_notebooks.py 2>&1 | tee "$RUNNER_TEMP/ci-out/notebooks.log"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebooks
          path: ${{ runner.temp }}/ci-out/notebooks.log
          if-no-files-found: warn
          retention-days: 14

  publish-results:
    needs: [test, notebooks]
    if: always() && github.event_name == 'push' && github.ref != 'refs/heads/main' && needs.test.result != 'cancelled' && needs.notebooks.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: ci-artifacts
      - name: Assemble committable results
        env:
          CI_TEST_RESULT: ${{ needs.test.result }}
          CI_NOTEBOOKS_RESULT: ${{ needs.notebooks.result }}
        run: python scripts/publish_ci_results.py ci-artifacts results/ci
      - name: Commit results to this branch
        run: |
          git add results/ci
          if git diff --cached --quiet; then
            echo "CI results are already on the branch"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Record GitHub Actions results for ${{ github.sha }}"
          git push origin "HEAD:${{ github.ref_name }}"
