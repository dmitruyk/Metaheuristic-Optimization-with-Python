[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metaopt"
version = "0.1.0"
description = "Companion code for Metaheuristic Optimization with Python by Yuriy Romasevych, Viatcheslav Loveikin, and Dmytro Komarchuk."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Yuriy Romasevych"},
  {name = "Viatcheslav Loveikin"},
  {name = "Dmytro Komarchuk"},
]
keywords = ["optimization", "pso", "differential-evolution", "grey-wolf-optimizer"]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
notebooks = [
  "pandas>=2.1",
  "sympy>=1.12",
  "jupyter>=1.0",
  "nbclient>=0.10",
  "ipykernel>=6.29",
]
experiments = [
  "pandas>=2.1",
  "joblib>=1.3",
  "tqdm>=4.66",
  "openpyxl>=3.1",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pandas>=2.1",
  "sympy>=1.12",
  "jupyter>=1.0",
  "nbclient>=0.10",
  "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests", "examples", "scripts"]
extend-exclude = ["docs", "manuscript_extract", ".cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**/*.ipynb" = ["E501", "I001"]
"src/metaopt/benchmarks.py" = ["E501"]
"scripts/write_notebooks.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
